  <script>
    (function () {
      var hostname = window.location.hostname;
      var pathname = window.location.pathname;
      var manifestHref = '/manifest.json';
      var appTitle = 'CS Dwindo Bintaro';
      var themeColor = '#111111';
      var iconHref = '/apps.png';

      if (hostname === 'panel.csdwindo.com' || pathname.startsWith('/panel')) {
        manifestHref = '/panel-manifest.json';
        appTitle = 'CSDwindo Panel';
      } else if (pathname.startsWith('/sa')) {
        manifestHref = '/sa-manifest.json';
        appTitle = 'Dwindo SA';
      }

      var head = document.head;
      var manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestHref;
      head.appendChild(manifestLink);

      var themeMeta = document.createElement('meta');
      themeMeta.name = 'theme-color';
      themeMeta.content = themeColor;
      head.appendChild(themeMeta);

      var titleMeta = document.createElement('meta');
      titleMeta.name = 'apple-mobile-web-app-title';
      titleMeta.content = appTitle;
      head.appendChild(titleMeta);

      var touchIcon = document.createElement('link');
      touchIcon.rel = 'apple-touch-icon';
      touchIcon.href = iconHref;
      head.appendChild(touchIcon);
    })();
  </script>
